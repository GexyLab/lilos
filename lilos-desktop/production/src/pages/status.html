<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<title>lilOS</title>
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="status.css">
</head>
<body>
<main class="status">
  <img class="logo" src="../assets/logo.svg" alt="">
  <div class="title"><span class="spinner" id="spinner"></span><h1 id="title"></h1></div>
  <p id="text"></p>
  <div class="error" id="error" role="alert" hidden></div>
  <div class="log" id="log" role="log" aria-live="polite" hidden></div>
  <div class="actions" id="actions" hidden>
    <button class="btn primary" id="retry" type="button" data-t="retry"></button>
    <button class="btn" id="servers" type="button" data-t="servers"></button>
    <button class="btn" id="logs" type="button" data-t="logs"></button>
  </div>
</main>
<script type="module" src="status.js"></script>
</body>
</html>
