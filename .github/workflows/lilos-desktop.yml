# The program lilOS (lilos-desktop/production): installers for Windows, macOS and Linux.
# Runs at the tag release-vX.Y.Z (made at «pubblica release», after npm run release:desktop made
# production/ from development/); X.Y.Z is the version of lilOS the packages carry (production/
# package.json "version"; the program's own is "programVersion")
# and creates the GitHub release with the packages in the official repository
# (GexyLab/lilos-plugins-official, public; this one is private): the program updates itself from
# there. Writing there needs the secret RELEASES_TOKEN, a fine-grained token with Contents:
# read and write on lilos-plugins-official (github.token only writes to this repository).
name: lilOS desktop

on:
  push:
    tags: ['release-v*']
  workflow_dispatch:
    inputs:
      release:
        description: Create the GitHub release (only from a release-v* tag)
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: lilos-desktop/production

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            runtime: win32:x64
            builder: --win --x64
          - name: macos
            os: macos-latest
            runtime: darwin:arm64 darwin:x64
            builder: --mac --arm64 --x64
          - name: linux-x64
            os: ubuntu-latest
            runtime: linux:x64
            builder: --linux --x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            runtime: linux:arm64
            builder: --linux --arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lilos-desktop/production/package-lock.json

      - name: Version of the tag = version of lilOS in production/package.json
        if: startsWith(github.ref, 'refs/tags/release-v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#release-v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then echo "Il tag dice $want, package.json dice $have"; exit 1; fi

      - run: npm ci

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Node, git, PostgreSQL and lilOS for each architecture
        shell: bash
        run: |
          for t in ${{ matrix.runtime }}; do
            node scripts/fetch-runtime.mjs --platform "${t%%:*}" --arch "${t##*:}"
          done

      - name: Packages
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.builder }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            lilos-desktop/production/dist/*.exe
            lilos-desktop/production/dist/*.msi
            lilos-desktop/production/dist/*.dmg
            lilos-desktop/production/dist/*.zip
            lilos-desktop/production/dist/*.AppImage
            lilos-desktop/production/dist/*.deb
            lilos-desktop/production/dist/*.rpm
            lilos-desktop/production/dist/*.blockmap
            lilos-desktop/production/dist/*.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/release-v') && (github.event_name == 'push' || inputs.release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: GitHub release in the official repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "Manca il secret RELEASES_TOKEN (token con Contents: read and write su GexyLab/lilos-plugins-official)"; exit 1; }
          notes="changelog/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || { echo "lilOS ${GITHUB_REF_NAME#release-v}" > /tmp/notes.md; notes=/tmp/notes.md; }
          rm -f packages/builder-debug.yml
          gh release create "$GITHUB_REF_NAME" packages/* -R GexyLab/lilos-plugins-official \
            --title "lilOS ${GITHUB_REF_NAME#release-v}" \
            --notes-file "$notes" --latest
